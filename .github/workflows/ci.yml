name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install openapi-spec-validator

      - name: Ruff lint
        run: ruff check --select E9,F63,F7,F82 src/ tests/ web/ mcp_server.py

      - name: MyPy type check
        run: mypy src/ web/ mcp_server.py --ignore-missing-imports || echo "MyPy is currently failing; omitted from strict pipeline enforcement until types are remediated."
        continue-on-error: true

      - name: OpenAPI validation
        run: openapi-spec-validator config/openapi.yaml

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-tagging-utils:ci .
