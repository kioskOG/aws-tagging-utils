AWSTemplateFormatVersion: '2010-09-09'
Description: 'EventBridge Rule to forward Tagging events to central account'

Resources:
  EventForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${ManagementAccountId}:event-bus/default'

  ForwardTaggingEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Description: 'Forwards resource creation and tag changes to central governance'
      EventPattern:
        source:
          - aws.tag
          - aws.ec2
          - aws.s3
          # ... add other services
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:events:${AWS::Region}:${ManagementAccountId}:event-bus/default'
          Id: 'CentralGovernanceBus'
          RoleArn: !GetAtt EventForwarderRole.Arn

Parameters:
  ManagementAccountId:
    Type: String
    Description: The AWS Account ID of the central governance account.
